<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 320px;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: #05030D;
      color: #F5F5F7;
      margin: 0;
      overflow: hidden;
    }
    .container {
      display: flex;
      flex-direction: column;
      padding: 16px;
      gap: 12px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 8px;
    }
    .header h1 {
      font-size: 20px;
      font-weight: 800;
      margin: 0;
      color: #F5F5F7;
      letter-spacing: -0.02em;
    }
    .card {
      background: #12101D;
      padding: 20px;
      border-radius: 16px;
      border: 1px solid #2A2340;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }
    .input-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    label {
      font-size: 10px;
      font-weight: 800;
      color: #A8A6B8;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }
    input[type="text"], input[type="email"] {
      padding: 12px;
      background: #05030D;
      border: 1px solid #2A2340;
      border-radius: 12px;
      font-size: 14px;
      color: #F5F5F7;
      outline: none;
      transition: all 0.2s;
    }
    input:focus {
      border-color: #FFFFFF;
      box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.1);
    }
    button {
      padding: 14px;
      background: #FFFFFF;
      color: #000000;
      border: none;
      border-radius: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    button:hover {
      background: #F5F5F7;
      transform: translateY(-1px);
    }
    .status {
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: #A8A6B8;
    }
    .status span {
      font-size: 8px;
      color: #10b981;
    }
    .status strong {
      color: #F5F5F7;
    }
    
    .bw-btn-secondary {
      background: #12101D;
      color: #A8A6B8;
      border: 1px solid #2A2340;
    }
    .bw-btn-secondary:hover {
      background: #1A1828;
      border-color: #FFFFFF;
      color: #F5F5F7;
    }
    .bw-btn-danger {
      background: rgba(239, 68, 68, 0.1);
      color: #ef4444;
      border: 1px solid rgba(239, 68, 68, 0.1);
    }
    .bw-btn-danger:hover {
      background: #ef4444;
      color: white;
    }

    /* Switch styling */
    .switch {
      position: relative;
      display: inline-block;
      width: 40px;
      height: 20px;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute;
      cursor: pointer;
      inset: 0;
      background-color: #2A2340;
      transition: .4s;
      border-radius: 20px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 14px;
      width: 14px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .4s;
      border-radius: 50%;
    }
    input:checked + .slider { background-color: #FFFFFF; }
    input:checked + .slider:before { background-color: #000000; transform: translateX(20px); }

    #activation-screen { display: none; }
    #main-screen { display: none; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div style="background: #3b82f6; width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold;">B</div>
      <h1>Blurra</h1>
    </div>

    <div id="activation-screen" class="card container">
      <div class="input-group">
        <label>Email Address</label>
        <input type="email" id="email-address" placeholder="you@example.com">
      </div>
      <div class="input-group">
        <label>Username</label>
        <input type="text" id="device-name" placeholder="Victor">
      </div>
      <button id="activate-btn">Upgrade to Pro</button>
    </div>

    <!-- Main Screen -->
    <div id="main-screen" class="container">
      <div class="card">
        <div class="status active" id="license-status">
          <span>●</span> License Active: <strong id="display-device">Device</strong>
        </div>
      </div>
      
      <div class="card container" style="padding: 16px;">
        <button id="toggle-btn">Activate Blur Mode</button>
        <button id="deactivate-btn" class="bw-btn-danger" style="font-size: 11px; padding: 10px;">Turn off Blur Activation</button>
      </div>

      <button id="main-upgrade-btn" style="display: none;">Upgrade to Pro</button>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
